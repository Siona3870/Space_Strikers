<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Interface</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #6c63ff;
            --primary-dark: #574ae2;
            --secondary-color: #00bcd4;
            --background-light: #f5f7fa;
            --text-dark: #333;
            --text-light: #fefefe;
            --border-color: #e0e0e0;
            --shadow-light: rgba(0, 0, 0, 0.08);
            --shadow-medium: rgba(0, 0, 0, 0.15);
            --bubble-user1: #e0e0ff;
            --bubble-user2: #c0f0f0;
        }

        body {
            background-image: url("background.jpg");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding-top: 60px; /* Adjusted padding-top to accommodate your specific nav height */
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- Navigation bar styles (from your provided snippet) --- */
        nav {
            background-color: rgba(34, 34, 34, 0.7);
            width: 100%;
            padding: 10px 0;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000; /* Ensure nav is above other elements */
        }

        nav ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: flex-end;
            padding-right: 20px; /* Add some padding on the right for the links */
        }

        nav li {
            margin: 0 15px; /* Slightly reduced margin for more links */
        }

        nav a {
            text-decoration: none;
            color: #fff;
            font-size: 16px; /* Adjusted font size slightly */
            transition: color 0.2s ease-in-out;
        }

        nav a:hover {
            color: var(--primary-color); /* Add a hover effect for nav links */
        }
        /* --- End Navigation bar styles --- */


        .container {
            background-color: rgba(255, 255, 255, 0.98);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 30px var(--shadow-medium);
            max-width: 1100px;
            margin: 30px auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
        }

        .col-6 {
            flex: 1;
            min-width: 300px;
            border-radius: 15px;
            padding: 25px;
            background-color: var(--background-light);
            box-shadow: 0 4px 15px var(--shadow-light);
            height: 500px;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
        }

        h3 {
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            color: var(--primary-color);
            font-weight: 600;
            font-size: 1.5em;
        }

        .chat-box {
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 10px;
            margin-bottom: 20px;
            /* Custom scrollbar for modern look */
            scrollbar-width: thin;
            scrollbar-color: var(--primary-color) var(--background-light);
        }
        .chat-box::-webkit-scrollbar {
            width: 8px;
        }
        .chat-box::-webkit-scrollbar-track {
            background: var(--background-light);
            border-radius: 10px;
        }
        .chat-box::-webkit-scrollbar-thumb {
            background-color: var(--primary-color);
            border-radius: 10px;
            border: 2px solid var(--background-light);
        }

        .chat-box p {
            padding: 12px 18px;
            margin: 10px 0;
            border-radius: 20px;
            max-width: 85%;
            word-wrap: break-word;
            font-size: 15px;
            line-height: 1.5;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .chat-box p strong {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9em;
            color: var(--primary-dark);
        }

        /* User specific bubble styles */
        #user1-chat p {
            background-color: var(--bubble-user1);
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }

        #user2-chat p {
            background-color: var(--bubble-user2);
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }

        /* Input and Button Container */
        .input-group {
            display: flex;
            gap: 10px;
            margin-top: auto;
            padding-top: 20px;
        }

        .form-control {
            flex-grow: 1;
            padding: 12px 15px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            font-family: 'Poppins', sans-serif;
            color: var(--text-dark);
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.2);
        }

        .btn-primary {
            padding: 12px 25px;
            background-color: var(--primary-color);
            color: var(--text-light);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease-in-out, transform 0.1s ease-in-out;
            font-size: 16px;
            font-weight: 500;
            flex-shrink: 0;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* Responsive Adjustments */
        @media (max-width: 992px) {
            .container {
                padding: 20px;
                margin: 20px auto;
                max-width: 90%;
            }
            .row {
                flex-direction: column;
                gap: 20px;
            }
            .col-6 {
                height: 450px;
                padding: 20px;
            }
        }

        @media (max-width: 576px) {
            body {
                padding-top: 60px; /* Adjust for smaller screens */
            }
            nav ul {
                padding-right: 10px;
            }
            nav li {
                margin: 0 10px;
            }
            nav a {
                font-size: 14px;
            }
            .container {
                padding: 15px;
                margin: 15px auto;
                max-width: 95%;
            }
            .col-6 {
                height: 400px;
                padding: 15px;
            }
            h3 {
                font-size: 1.3em;
                margin-bottom: 15px;
            }
            .chat-box p {
                font-size: 13px;
                padding: 10px 15px;
                margin: 8px 0;
            }
            .input-group {
                flex-direction: column;
                gap: 10px;
            }
            .btn-primary {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html" id="Home-link">Home</a></li>
            <li><a href="login.html" id="Login-link">Login</a></li>
            <li><a href="team.html" id="Team-link">Team</a></li>
            <li><a href="project.html" id="project-link">Project</a></li>
            <li><a href="comic.html" id="Comic-link">Comic</a></li>
            <li><a href="visualise.html">Visualise</a></li>
            <li><a href="businessmodel.html" id="bsmodel-link">Business Model</a></li>
            <li><a href="video.html" id="Video-link">Video</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-6">
                <h3>User 1</h3>
                <div class="chat-box" id="user1-chat"></div>
                <div class="input-group">
                    <input type="text" class="form-control" id="user1-message" placeholder="Type a message..." onkeypress="handleKeyPress(event, 'user1')" />
                    <button class="btn-primary" onclick="sendMessage('user1')">Send</button>
                </div>
            </div>
            <div class="col-6">
                <h3>User 2</h3>
                <div class="chat-box" id="user2-chat"></div>
                <div class="input-group">
                    <input type="text" class="form-control" id="user2-message" placeholder="Type a message..." onkeypress="handleKeyPress(event, 'user2')" />
                    <button class="btn-primary" onclick="sendMessage('user2')">Send</button>
                </div>
            </div>
        </div>
    </div>

    <div id="root"></div> <script>
        function sendMessage(user) {
            const messageInput = document.getElementById(`${user}-message`);
            const chatDiv = document.getElementById(`${user}-chat`);
            const otherUser = user === "user1" ? "user2" : "user1";
            const otherChatDiv = document.getElementById(`${otherUser}-chat`);

            const message = messageInput.value.trim();
            if (message === "") return;

            // Add message to current user's chat box
            const msgElement = document.createElement("p");
            msgElement.innerHTML = `<strong>${user === "user1" ? "You" : "User 2"}</strong>${message}`;
            chatDiv.appendChild(msgElement);

            // Add simulated response to the other user's chat box
            const responseElement = document.createElement("p");
            responseElement.innerHTML = `<strong>${user === "user1" ? "User 2" : "You"}</strong>Reply to: ${message}`;
            otherChatDiv.appendChild(responseElement);

            messageInput.value = "";
            chatDiv.scrollTop = chatDiv.scrollHeight;
            otherChatDiv.scrollTop = otherChatDiv.scrollHeight;

            // Note: Your original local storage and postMessage logic remains,
            // but for this single-page example, the immediate append to both
            // chat boxes creates the visual effect directly.
            // If you intend for this to be across truly separate windows,
            // the local storage/postMessage will handle the actual data transfer.
            // For now, I've kept your original JS functions as they were.
        }

        // Add keyboard support (Enter key to send)
        function handleKeyPress(event, user) {
            if (event.key === 'Enter') {
                sendMessage(user);
            }
        }
        window.addEventListener("message", (event) => {
            try {
                const messageData = JSON.parse(event.data);
                if (messageData.user && messageData.message) {
                    const user = messageData.user;
                    const chatDiv = document.getElementById(`${user}-chat`);
                    // Prevent duplicate if sendMessage already added it
                    if (!chatDiv.innerHTML.includes(`<strong>${messageData.user}:</strong> ${messageData.message}`)) {
                         chatDiv.innerHTML += `<p><strong>${messageData.user}:</strong> ${messageData.message}</p>`;
                    }
                }
            } catch (error) {
                console.error("Error parsing message:", error);
            }
        });

        window.addEventListener("load", () => {
            displayMessages("user1");
            displayMessages("user2");
        });

        function displayMessages(user) {
            const chatDiv = document.getElementById(`${user}-chat`);
            const messages = JSON.parse(localStorage.getItem(user)) || [];
            messages.forEach((msg) => {
                chatDiv.innerHTML += `<p><strong>${msg.user}:</strong> ${msg.message}</p>`;
            });
        }
    </script>
</body>
</html>
